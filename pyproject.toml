[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ewu"
version = "0.1.0"
description = "Does urbanization change how often places experience extreme weather? Paired urban-rural NOAA station analysis."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "certifi>=2023.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = ["ewu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
